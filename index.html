<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine?</title>
  <style>
    :root {
      --primary-pink: #ff4d6d;
      --soft-pink: #ffe6eb;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--soft-pink);
      overflow: hidden; /* Prevents scrollbars when button moves */
      touch-action: manipulation; /* Improves mobile tap response */
    }

    .container {
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
      z-index: 10;
      width: 80%;
      max-width: 400px;
    }

    h1 {
      color: #333;
      font-size: 1.8rem;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 50px;
    }

    button {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 25px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yes {
      background: var(--primary-pink);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
    }

    #yes:active {
      transform: scale(0.9);
    }

    #no {
      background: #888;
      color: white;
      position: fixed; /* Fixed is safer for "runaway" buttons */
      transition: all 0.1s ease-out;
      z-index: 100;
    }

    .heart {
      position: absolute;
      color: var(--primary-pink);
      font-size: 20px;
      pointer-events: none;
      animation: float 4s linear forwards;
    }

    @keyframes float {
      to {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container" id="main-box">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="btn-group">
      <button id="yes" onclick="celebrate()">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    // Unified function for mobile touch and desktop mouse
    const moveButton = () => {
      // Calculate safe boundaries (keeping button inside the viewport)
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    };

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", (e) => {
        e.preventDefault(); // Prevents clicking the button on touch
        moveButton();
    });

    function celebrate() {
      // Clear the box and show success message
      const box = document.getElementById('main-box');
      box.innerHTML = `
        <h1 style="font-size: 3rem;">🎉</h1>
        <h1>YAY! ❤️</h1>
        <p>You've made me the happiest person!</p>
      `;

      // Start the heart shower
      setInterval(createHeart, 300);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = '100vh';
      heart.style.opacity = Math.random();
      heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 4000);
    }
  </script>

</body>
</html>
