<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Sunset Background Gradient */
      background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 50%, #ffac81 100%);
      overflow: hidden;
      touch-action: manipulation;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85); /* Semi-transparent white */
      backdrop-filter: blur(10px);
      padding: 3rem;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      z-index: 10;
      width: 85%;
      max-width: 400px;
    }

    h1 {
      color: #d63384;
      font-size: 2rem;
      margin-bottom: 2rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
    }

    #no {
      background: #6c757d;
      color: white;
      position: relative; /* Starts next to Yes */
      z-index: 100;
    }

    /* Falling Elements */
    .deco {
      position: absolute;
      pointer-events: none;
      user-select: none;
      animation: fall 5s linear forwards;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container" id="main-box">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="btn-group">
      <button id="yes" onclick="celebrate()">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const icons = ['🌸', '❤️', '🌹', '✨', '🌷', '💖'];

    // Move "No" button
    const moveButton = () => {
      noBtn.style.position = "fixed";
      const padding = 50;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    };

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveButton();
    });

    // Success state
    function celebrate() {
      const box = document.getElementById('main-box');
      box.innerHTML = `
        <h1 style="font-size: 3rem;">🌹</h1>
        <h1>Perfect! ❤️</h1>
        <p>I'll see you then!</p>
      `;
      // Intense flower/heart shower
      setInterval(createDeco, 150);
    }

    // Helper to create falling hearts and flowers
    function createDeco() {
      const el = document.createElement('div');
      el.classList.add('deco');
      el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-5vh';
      el.style.fontSize = (Math.random() * 20 + 20) + 'px';
      document.body.appendChild(el);
      
      setTimeout(() => el.remove(), 5000);
    }

    // Start a gentle shower immediately for the sunset vibe
    setInterval(createDeco, 1000);
  </script>

</body>
</html>
