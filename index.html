<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;

      /* 🌅 Sunset background */
      background: linear-gradient(
        180deg,
        #ff9a9e 0%,
        #fad0c4 40%,
        #fad0c4 60%,
        #fbc2eb 100%
      );
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: rgba(255, 0, 90, 0.6);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Main card */
    .box {
      z-index: 2;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 35px 45px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 28px;
      color: #c9184a;
    }

    button {
      font-size: 18px;
      padding: 12px 26px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #adb5bd;
      position: absolute;
    }

    /* Flower corners */
    .flower {
      position: absolute;
      font-size: 28px;
      opacity: 0.7;
    }

    .f1 { top: 20px; left: 20px; }
    .f2 { top: 20px; right: 20px; }
    .f3 { bottom: 20px; left: 20px; }
    .f4 { bottom: 20px; right: 20px; }

  </style>
</head>

<body>

  <!-- 🌸 Flowers -->
  <div class="flower f1">🌸</div>
  <div class="flower f2">🌺</div>
  <div class="flower f3">🌷</div>
  <div class="flower f4">🌼</div>

  <div class="box">
    <h1>Will you be my Valentine? 💖</h1>
    <button id="yes" onclick="yesClicked()">Yes</button>
    <button id="no">No</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          font-size:34px;
          font-family:'Segoe UI', Arial;
          color:#c9184a;
          background:linear-gradient(180deg,#ff9a9e,#fad0c4);">
          💘 You just made my sunset brighter 💘
        </div>`;
    }

    /* Generate floating hearts */
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 20) + "px";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }, 400);
  </script>

</body>
</html>
